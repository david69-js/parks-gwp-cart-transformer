query CartTransformRunInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
        }
      }
      giftMarker: attribute(key: "_gwp_gift") {
        value
      }
    }
  }
  shop {
    metafield(namespace: "$app:gwp", key: "config") {
      jsonValue
    }
  }
}
